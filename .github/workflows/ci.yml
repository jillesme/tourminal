name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l .)"
          if [[ -n "$files" ]]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build command and compatibility alias
        run: |
          go build -o tour ./cmd/tourminal
          go build -o tourminal ./cmd/tourminal

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [darwin, linux]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -o tour ./cmd/tourminal
          go build -o tourminal ./cmd/tourminal

  release-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean
      - name: Verify both command names are packaged
        shell: bash
        run: |
          archive_count=0
          for archive in dist/tourminal_*.tar.gz; do
            test -f "$archive"
            members="$(tar -tzf "$archive")"
            grep -qx tour <<<"$members"
            grep -qx tourminal <<<"$members"
            archive_count=$((archive_count + 1))
          done
          test "$archive_count" -eq 4
